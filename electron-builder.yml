appId: com.chunkforge.app
productName: Chunkforge
copyright: Chunkforge

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!scripts/*'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Chunkforge-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chunkforge
  uninstallDisplayName: Chunkforge

publish:
  provider: github
  owner: scopeddlol
  repo: chunkforge
