# Chunkforge Portal — run this on your VPS.
#
# Two things are published: the admin UI, and the range of ports player traffic
# lands on. Every server on every node is funnelled through that range, which is
# why it must be reachable here and nowhere else.
services:
  chunkforge-portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    image: ghcr.io/scopeddlol/chunkforge-portal:latest
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      CHUNKFORGE_PORTAL_DATA: /data
    ports:
      # Admin UI and the node/control-plane API.
      - "${CHUNKFORGE_PORTAL_PORT:-8080}:8080"
      # Player traffic. Must match the port range set under Portal → Settings.
      - "${CHUNKFORGE_RANGE_START:-25600}-${CHUNKFORGE_RANGE_END:-25699}:${CHUNKFORGE_RANGE_START:-25600}-${CHUNKFORGE_RANGE_END:-25699}/tcp"
      - "${CHUNKFORGE_RANGE_START:-25600}-${CHUNKFORGE_RANGE_END:-25699}:${CHUNKFORGE_RANGE_START:-25600}-${CHUNKFORGE_RANGE_END:-25699}/udp"
    volumes:
      - chunkforge-portal-data:/data
    restart: unless-stopped

volumes:
  chunkforge-portal-data:
