services:
  chunkforge-portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      CHUNKFORGE_DATA: /data
      CHUNKFORGE_ALLOWED_ORIGINS: ${CHUNKFORGE_ALLOWED_ORIGINS:-}
    ports:
      - "${CHUNKFORGE_PORT:-8080}:8080"
    volumes:
      - chunkforge-portal-data:/data
    restart: unless-stopped

volumes:
  chunkforge-portal-data:
