# Chunkforge Web on a homelab — panel only.
#
# Manages servers that run on nodes elsewhere. Port 8080 is the panel on your
# own network; player traffic never reaches this container.
services:
  chunkforge-web:
    image: ghcr.io/scopeddlol/chunkforge-web:latest
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      CHUNKFORGE_DATA: /data
    ports:
      - "${CHUNKFORGE_WEB_PORT:-8080}:8080"
    volumes:
      - web-data:/data
    restart: unless-stopped

volumes:
  web-data:
