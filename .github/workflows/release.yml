name: Release

on:
  push:
    tags: ['v*']
    tags-ignore:
      - '*-portal'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure app-builder binary
        shell: pwsh
        run: |
          $path = "node_modules\app-builder-bin\win\x64\app-builder.exe"
          if (-not (Test-Path $path)) {
            npm install --no-save app-builder-bin@5.0.0-alpha.13
          }
          if (-not (Test-Path $path)) {
            throw "Missing app-builder binary at $path"
          }

      # Compiles main/preload/renderer into out/ before packaging — electron-builder
      # only bundles what electron-vite has already emitted.
      - name: Build and publish installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
