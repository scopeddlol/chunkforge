name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # Server-side pieces release far more often than the desktop app, so a tag
    # suffixed with the component name ships only that image and skips building
    # a Windows installer nothing in it changed.
    if: >-
      ${{ github.event_name != 'push' ||
      (!endsWith(github.ref_name, '-portal') &&
       !endsWith(github.ref_name, '-web') &&
       !endsWith(github.ref_name, '-node')) }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure electron-builder binaries
        shell: pwsh
        run: |
          # electron-builder shells out to two vendored Windows binaries. Both
          # can go missing after an `npm install --no-save` re-resolves the
          # tree, and hoisting moves as packages are added to the workspace —
          # so each is checked, repaired, and then re-checked in that order,
          # because repairing the first is itself a re-resolve that can
          # disturb the second.
          $appBuilder = "node_modules\app-builder-bin\win\x64\app-builder.exe"
          $sevenZip = "node_modules\7zip-bin\win\x64\7za.exe"

          if (-not (Test-Path $appBuilder)) {
            npm install --no-save app-builder-bin@5.0.0-alpha.13
          }
          if (-not (Test-Path $sevenZip)) {
            npm install --no-save 7zip-bin@5.2.0
          }

          if (-not (Test-Path $appBuilder)) { throw "Missing app-builder binary at $appBuilder" }
          if (-not (Test-Path $sevenZip)) { throw "Missing 7-Zip binary at $sevenZip" }

      # Compiles main/preload/renderer into out/ before packaging — electron-builder
      # only bundles what electron-vite has already emitted.
      - name: Build and publish desktop installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published into the same release. The node is a separate product with
      # its own installer, but it ships in lockstep with the panel it talks to.
      - name: Build and publish node installer
        run: npm run release:win:node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
