name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure app-builder binary
        shell: pwsh
        run: |
          $path = "node_modules\app-builder-bin\win\x64\app-builder.exe"
          if (-not (Test-Path $path)) {
            npm install --no-save app-builder-bin@5.0.0-alpha.13
          }
          if (-not (Test-Path $path)) {
            throw "Missing app-builder binary at $path"
          }

      - name: Build installer
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunkforge-windows
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/latest.yml
          if-no-files-found: error
