name: Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Portal image (CI)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.portal
          push: false
          load: false
          tags: chunkforge-portal:ci

      - name: Build Node image (CI)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.node
          push: false
          load: false
          tags: chunkforge-node:ci

      - name: Publish Portal image (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.portal
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chunkforge-portal:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/chunkforge-portal:latest

      - name: Publish Node image (Release)
        if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-portal')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.node
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chunkforge-node:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/chunkforge-node:latest
